<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTE Weekly Job Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0f1e3d;
    --navy-mid:#1a3059;
    --gold:#c9a227;
    --gold-light:#e3c568;
    --bg:#f5f4ef;
    --card:#ffffff;
    --text:#1c2230;
    --text-sec:#5b6272;
    --text-mute:#8b8f9b;
    --border:#e2ded2;
    --danger:#b23b3b;
    --danger-bg:#f9e9e8;
    --success:#3f7a52;
    --success-bg:#e9f3ec;
    --amber:#a9740f;
    --amber-bg:#faf1de;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1080px;margin:0 auto;padding:28px 24px 80px;}

  /* Header */
  .header{
    background:var(--navy);
    color:#fff;
    border-radius:12px;
    padding:26px 30px;
    margin-bottom:24px;
    position:relative;
    overflow:hidden;
  }
  .header::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:160px; height:160px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(201,162,39,0.14) 0%, rgba(201,162,39,0) 70%);
  }
  .header-top{display:flex; justify-content:space-between; align-items:flex-start; gap:20px;}
  .brand{font-family:'Oswald',sans-serif; font-weight:700; font-size:13px; letter-spacing:3px; color:var(--gold-light); text-transform:uppercase;}
  .title{font-family:'Oswald',sans-serif; font-weight:600; font-size:28px; margin:4px 0 2px; letter-spacing:0.3px;}
  .subtitle{font-size:13.5px; color:#c3cae0;}
  .header-meta{text-align:right; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#9fb0d6;}
  .circuit{
    display:flex; align-items:center; gap:6px; margin-top:18px;
  }
  .circuit-line{flex:1; height:1px; background:linear-gradient(90deg, rgba(201,162,39,0.7), rgba(201,162,39,0.1));}
  .circuit-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);}

  /* Tabs / actions */
  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
  .toolbar-left{display:flex; gap:8px; align-items:center;}
  .stat-pill{
    font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--text-sec);
    background:var(--card); border:1px solid var(--border); padding:6px 12px; border-radius:20px;
  }
  button{
    font-family:'Inter',sans-serif; cursor:pointer; border-radius:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); padding:9px 16px; font-size:13.5px; font-weight:500;
    transition:all .12s ease;
  }
  button:hover{border-color:var(--navy-mid); background:#fbfaf7;}
  button:active{transform:scale(0.98);}
  button.primary{background:var(--navy); color:#fff; border-color:var(--navy);}
  button.primary:hover{background:var(--navy-mid);}
  button.gold{background:var(--gold); color:var(--navy); border-color:var(--gold); font-weight:600;}
  button.gold:hover{background:var(--gold-light);}
  button.ghost{background:transparent; border-color:transparent; color:var(--text-sec); padding:6px 10px;}
  button.ghost:hover{background:#eeece5;}
  button.danger-text{color:var(--danger); border-color:transparent; background:transparent;}
  button.small{padding:6px 11px; font-size:12.5px;}

  /* Job grid */
  .job-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px;}
  .job-card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px 18px 16px; display:flex; flex-direction:column; gap:10px;
  }
  .job-card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .job-name{font-family:'Oswald',sans-serif; font-weight:600; font-size:16.5px; line-height:1.25;}
  .job-sub{font-size:12.5px; color:var(--text-sec); margin-top:2px;}
  .badge{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px; white-space:nowrap;
    font-family:'IBM Plex Mono',monospace; letter-spacing:0.3px;
  }
  .badge.ok{background:var(--success-bg); color:var(--success);}
  .badge.due{background:var(--amber-bg); color:var(--amber);}
  .badge.overdue{background:var(--danger-bg); color:var(--danger);}
  .badge.risk-low{background:var(--success-bg); color:var(--success);}
  .badge.risk-medium{background:var(--amber-bg); color:var(--amber);}
  .badge.risk-high{background:var(--danger-bg); color:var(--danger);}
  .badge.risk-analyzing{background:#eeece5; color:var(--text-sec);}
  .job-meta-row{font-size:12.5px; color:var(--text-sec); display:flex; gap:6px;}
  .job-meta-row b{color:var(--text); font-weight:500;}
  .job-card-actions{display:flex; gap:6px; margin-top:6px; flex-wrap:wrap;}

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--text-sec);
    background:var(--card); border:1px dashed var(--border); border-radius:var(--radius);
  }
  .empty-state h3{font-family:'Oswald',sans-serif; color:var(--text); margin-bottom:6px;}

  /* Panel / form */
  .panel-overlay{
    position:fixed; inset:0; background:rgba(15,30,61,0.45); display:flex;
    align-items:flex-start; justify-content:center; padding:40px 20px; z-index:50; overflow-y:auto;
  }
  .panel{
    background:var(--card); border-radius:14px; width:100%; max-width:640px;
    padding:0; box-shadow:0 20px 60px rgba(0,0,0,0.25);
  }
  .panel-header{
    padding:20px 26px; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center;
  }
  .panel-header h2{font-family:'Oswald',sans-serif; font-size:19px; margin:0; font-weight:600;}
  .panel-body{padding:22px 26px 26px; display:flex; flex-direction:column; gap:16px;}
  .panel-footer{padding:16px 26px 22px; display:flex; justify-content:flex-end; gap:8px; border-top:1px solid var(--border);}

  label{font-size:12.5px; font-weight:600; color:var(--text-sec); text-transform:uppercase; letter-spacing:0.4px; display:block; margin-bottom:6px;}
  .field{display:flex; flex-direction:column;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  input[type=text], input[type=date], input[type=number], textarea, select{
    font-family:'Inter',sans-serif; font-size:14px; padding:9px 11px; border:1px solid var(--border);
    border-radius:8px; background:#fdfcfa; color:var(--text); width:100%;
  }
  input:focus, textarea:focus, select:focus{outline:none; border-color:var(--navy-mid); box-shadow:0 0 0 3px rgba(26,48,89,0.1);}
  textarea{resize:vertical; min-height:64px; font-family:'Inter',sans-serif; line-height:1.5;}
  .hint{font-size:11.5px; color:var(--text-mute); margin-top:4px;}

  /* History list */
  .history-list{display:flex; flex-direction:column; gap:8px;}
  .history-row{
    display:flex; justify-content:space-between; align-items:center; padding:11px 14px;
    border:1px solid var(--border); border-radius:8px; background:var(--card); font-size:13.5px;
  }
  .history-row-left{display:flex; flex-direction:column; gap:2px;}
  .history-date{font-family:'IBM Plex Mono',monospace; font-weight:500; font-size:13px;}
  .history-summary{color:var(--text-sec); font-size:12px;}

  /* Report print view */
  .report-view{background:#fff;}
  .report-doc{
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:0; overflow:hidden;
  }
  .report-band{background:var(--navy); color:#fff; padding:22px 30px;}
  .report-band .rbrand{font-family:'Oswald',sans-serif; font-weight:700; font-size:12px; letter-spacing:3px; color:var(--gold-light);}
  .report-band .rtitle{font-family:'Oswald',sans-serif; font-size:22px; font-weight:600; margin-top:4px;}
  .report-band .rsub{font-size:12.5px; color:#c3cae0; margin-top:6px;}
  .report-info{
    display:grid; grid-template-columns:1fr 1fr; gap:14px 30px;
    padding:20px 30px; border-bottom:1px solid var(--border); background:#fbfaf7;
    font-size:13px;
  }
  .info-item .il{color:var(--text-sec); font-size:11px; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:3px;}
  .info-item .iv{font-weight:500;}
  .report-sections{padding:22px 30px 30px; display:flex; flex-direction:column; gap:20px;}
  .rsection h4{
    font-family:'Oswald',sans-serif; font-size:13.5px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--navy); margin:0 0 8px; padding-bottom:6px; border-bottom:2px solid var(--gold);
    display:inline-block;
  }
  .rsection p{font-size:13.5px; line-height:1.65; margin:0; white-space:pre-wrap; color:var(--text);}
  .progress-track{background:#eae7dd; border-radius:20px; height:10px; overflow:hidden; margin-top:6px;}
  .progress-fill{background:var(--gold); height:100%;}

  .report-actions{display:flex; gap:8px; margin-bottom:14px;}

  .sr-only{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0);}

  @media print{
    body{background:#fff;}
    .app{max-width:100%; padding:0;}
    .no-print{display:none !important;}
    .report-doc{border:none; border-radius:0;}
    .panel-overlay{
      position:static !important; background:none !important; padding:0 !important;
      display:block !important; align-items:initial !important; justify-content:initial !important;
      overflow:visible !important; height:auto !important; min-height:0 !important;
    }
    .panel{
      max-width:100% !important; width:100% !important; box-shadow:none !important;
      border-radius:0 !important; height:auto !important; overflow:visible !important;
    }
    .report-view{overflow:visible !important;}
  }
  @media (max-width:640px){
    .field-row{grid-template-columns:1fr;}
    .report-info{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
(function(){
  const STORAGE_JOBS = 'jobs';
  const STORAGE_REPORTS = 'reports';

  let state = {
    jobs: [],
    reports: [],
    view: 'dashboard', // dashboard
    modal: null, // {type: 'addJob'|'editJob'|'newReport'|'history'|'viewReport', jobId, reportId}
    loading: true
  };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  const HAS_CLOUD_STORAGE = (typeof window.storage !== 'undefined' && window.storage !== null);

  async function storageGet(key){
    if(HAS_CLOUD_STORAGE){
      try{ const r = await window.storage.get(key); return r ? r.value : null; }
      catch(e){ return null; }
    }
    try{ return window.localStorage.getItem('hte_'+key); }
    catch(e){ return null; }
  }
  async function storageSet(key, value){
    if(HAS_CLOUD_STORAGE){
      try{ await window.storage.set(key, value); return; }
      catch(e){ /* fall through to local */ }
    }
    try{ window.localStorage.setItem('hte_'+key, value); }
    catch(e){ /* storage unavailable this session */ }
  }

  const SEED_JOBS = [
    {name:'Deep Manufacturing', jobNumber:'21-7037', foreman:'Louis Orocio', foremanPhone:'(713) 894-1687', address:'6410 Langfield Rd, Houston, TX 77092', startTime:'7:00am'},
    {name:'Drake Plastics', jobNumber:'21-7032', foreman:'', foremanPhone:'', address:'14869 Grant Rd, Cypress, TX 77429', startTime:'8:00am'},
    {name:'Project Mercury', jobNumber:'21-7035', foreman:'Angel Blume', foremanPhone:'(346) 243-8735', address:'3301 Pollok Dr, Conroe, TX 77303', startTime:'6:00am'},
    {name:"St Faustina", jobNumber:'21-4008', foreman:'Eliseo Guzmán', foremanPhone:'(281) 387-5672', address:'28102 FM 1093, Fulshear, TX 77441', startTime:'6:00am'},
    {name:'Intuitive Machines', jobNumber:'21-4009', foreman:'Freddy Lopez', foremanPhone:'(832) 647-2644', address:'13467 Columbia Shuttle Street, Houston, TX 77059', startTime:'7:00am'},
    {name:'USPI', jobNumber:'21-2082', foreman:'Louis Orocio', foremanPhone:'(713) 894-1687', address:'22215 Cypresswood Dr Ste 115, Cypress, TX 77433', startTime:'6:00am'},
    {name:'MAM', jobNumber:'21-3066', foreman:'Asael Navarro', foremanPhone:'(713) 363-3897', address:'1635 Blalock Rd, Houston, TX 77080', startTime:''},
    {name:"St John's School", jobNumber:'21-4010', foreman:'Francisco Orocio', foremanPhone:'(281) 960-8244', address:'3360 W Alabama St, Houston, TX 77098', startTime:'6:30am'}
  ];

  async function loadAll(){
    try{
      const jRaw = await storageGet('jobs');
      state.jobs = jRaw ? JSON.parse(jRaw) : null;
    }catch(e){ state.jobs = null; }
    if(!state.jobs || state.jobs.length === 0){
      state.jobs = SEED_JOBS.map(j => ({id: uid(), createdAt: todayISO(), ...j}));
      await saveJobs();
    }
    try{
      const rRaw = await storageGet('reports');
      state.reports = rRaw ? JSON.parse(rRaw) : [];
    }catch(e){ state.reports = []; }
    state.loading = false;
    render();
  }

  async function saveJobs(){
    await storageSet('jobs', JSON.stringify(state.jobs));
  }
  async function saveReports(){
    await storageSet('reports', JSON.stringify(state.reports));
  }

  function fmtDate(iso){
    if(!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
  }
  function daysSince(iso){
    if(!iso) return Infinity;
    const d = new Date(iso + 'T00:00:00');
    return Math.floor((Date.now() - d.getTime()) / 86400000);
  }
  function todayISO(){
    return new Date().toISOString().slice(0,10);
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function lastReportForJob(jobId){
    const rs = state.reports.filter(r => r.jobId === jobId).sort((a,b)=> b.weekEnding.localeCompare(a.weekEnding));
    return rs[0] || null;
  }
  function reportsForJob(jobId){
    return state.reports.filter(r => r.jobId === jobId).sort((a,b)=> b.weekEnding.localeCompare(a.weekEnding));
  }

  function statusBadge(job){
    const last = lastReportForJob(job.id);
    if(!last) return '<span class="badge overdue">No reports yet</span>';
    const days = daysSince(last.weekEnding);
    if(days <= 7) return '<span class="badge ok">Up to date</span>';
    if(days <= 13) return '<span class="badge due">Due this week</span>';
    return '<span class="badge overdue">'+days+' days overdue</span>';
  }

  function riskBadge(report, compact){
    if(!report) return '';
    if(report.riskLevel === 'analyzing') return '<span class="badge risk-analyzing">Checking risk…</span>';
    if(!report.riskLevel) return '';
    const label = {low:'Low risk', medium:'Watch', high:'High risk'}[report.riskLevel] || '';
    const cls = {low:'risk-low', medium:'risk-medium', high:'risk-high'}[report.riskLevel] || '';
    if(compact) return `<span class="badge ${cls}" title="${escapeHtml(report.riskReason||'')}">${label}</span>`;
    return `<span class="badge ${cls}">${label}</span>`;
  }

  async function analyzeRisk(report, job){
    const prior = reportsForJob(job.id).filter(r=>r.id!==report.id).slice(0,2);
    const context = prior.map(r => `Week ${r.weekEnding}: delays="${r.delays||'none'}" safety="${r.safetyNotes||'none'}"`).join('\n');
    const prompt = `You are reviewing a weekly construction job site report to flag schedule or safety risk. Respond with ONLY valid JSON, no markdown fences, no preamble, exactly this shape: {"riskLevel":"low","reason":"short sentence"} where riskLevel is "low", "medium", or "high".

Job: ${job.name}
This week's % complete: ${report.pctComplete || 'not given'}
Work completed: ${report.workCompleted || 'none noted'}
Delays/issues: ${report.delays || 'none noted'}
Safety notes: ${report.safetyNotes || 'none noted'}
Prior recent weeks for context (watch for recurring/unresolved issues):
${context || 'none available'}

Rules: "high" = real red flag (recurring/unresolved delay, safety incident, material or schedule risk that could push completion). "medium" = a single new issue worth watching but not yet critical. "low" = routine week, nothing concerning. Reason must be under 20 words and specific to this job.`;
    try{
      const response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-6",
          max_tokens: 1000,
          messages: [{ role: "user", content: prompt }]
        })
      });
      const data = await response.json();
      const text = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
      const clean = text.replace(/```json|```/g,'').trim();
      const parsed = JSON.parse(clean);
      if(!['low','medium','high'].includes(parsed.riskLevel)) return null;
      return {riskLevel: parsed.riskLevel, riskReason: String(parsed.reason||'').slice(0,200)};
    }catch(e){
      return null;
    }
  }

  async function runRiskAnalysis(reportId){
    const report = state.reports.find(r=>r.id===reportId);
    if(!report) return;
    const job = state.jobs.find(j=>j.id===report.jobId);
    const result = await analyzeRisk(report, job);
    const current = state.reports.find(r=>r.id===reportId);
    if(!current) return;
    if(result){
      current.riskLevel = result.riskLevel;
      current.riskReason = result.riskReason;
    } else {
      current.riskLevel = null;
      current.riskReason = null;
    }
    await saveReports();
    render();
  }

  // ---------- Rendering ----------
  function render(){
    const app = document.getElementById('app');
    if(state.loading){
      app.innerHTML = '<div style="padding:80px;text-align:center;color:var(--text-sec);">Loading job reports…</div>';
      return;
    }

    let html = '';
    html += renderHeader();
    html += '<div class="toolbar no-print">';
    html += '<div class="toolbar-left">';
    html += '<span class="stat-pill">'+state.jobs.length+' active job'+(state.jobs.length===1?'':'s')+'</span>';
    const dueCount = state.jobs.filter(j=>{
      const last = lastReportForJob(j.id);
      return !last || daysSince(last.weekEnding) > 7;
    }).length;
    if(dueCount>0) html += '<span class="stat-pill" style="color:var(--amber);border-color:var(--amber-bg);background:var(--amber-bg);">'+dueCount+' need'+(dueCount===1?'s':'')+' a report</span>';
    const highRiskCount = state.jobs.filter(j=>{
      const last = lastReportForJob(j.id);
      return last && last.riskLevel === 'high';
    }).length;
    if(highRiskCount>0) html += '<span class="stat-pill" style="color:var(--danger);border-color:var(--danger-bg);background:var(--danger-bg);">'+highRiskCount+' flagged high risk</span>';
    html += '</div>';
    html += '<button class="primary" onclick="App.openAddJob()">+ Add job</button>';
    html += '</div>';

    if(state.jobs.length === 0){
      html += '<div class="empty-state"><h3>No jobs yet</h3><p>Add your active job sites to start tracking weekly reports.</p><div style="margin-top:14px;"><button class="gold" onclick="App.openAddJob()">+ Add your first job</button></div></div>';
    } else {
      html += '<div class="job-grid">';
      state.jobs.forEach(job => { html += renderJobCard(job); });
      html += '</div>';
    }

    html += renderModal();

    app.innerHTML = html;
  }

  function renderHeader(){
    const now = new Date();
    return `
      <div class="header no-print">
        <div class="header-top">
          <div>
            <div class="brand">Hi-Tech Electric</div>
            <div class="title">Weekly Job Reports</div>
            <div class="subtitle">Superintendent dashboard — all active job sites</div>
          </div>
          <div class="header-meta">${now.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'})}</div>
        </div>
        <div class="circuit"><div class="circuit-dot"></div><div class="circuit-line"></div><div class="circuit-dot"></div><div class="circuit-line"></div><div class="circuit-dot"></div></div>
      </div>
    `;
  }

  function renderJobCard(job){
    const last = lastReportForJob(job.id);
    return `
      <div class="job-card">
        <div class="job-card-top">
          <div>
            <div class="job-name">${escapeHtml(job.name)}${job.jobNumber ? ' <span style="color:var(--text-mute);font-weight:500;">'+escapeHtml(job.jobNumber)+'</span>' : ''}</div>
            <div class="job-sub">${escapeHtml(job.address || 'No address listed')}</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:6px; align-items:flex-end;">
            ${statusBadge(job)}
            ${last ? riskBadge(last, true) : ''}
          </div>
        </div>
        <div class="job-meta-row"><span><b>Foreman:</b> ${escapeHtml(job.foreman || '—')}${job.foremanPhone ? ' · '+escapeHtml(job.foremanPhone) : ''}</span></div>
        <div class="job-meta-row"><span><b>Start:</b> ${escapeHtml(job.startTime || '—')} &nbsp; <b>Last report:</b> ${last ? fmtDate(last.weekEnding) : 'None'}</span></div>
        <div class="job-card-actions">
          <button class="gold small" onclick="App.openNewReport('${job.id}')">+ Weekly report</button>
          <button class="small" onclick="App.openHistory('${job.id}')">History (${reportsForJob(job.id).length})</button>
          <button class="ghost small" onclick="App.openEditJob('${job.id}')">Edit</button>
          <button class="ghost small danger-text" onclick="App.deleteJob('${job.id}')">Delete</button>
        </div>
      </div>
    `;
  }

  function renderModal(){
    if(!state.modal) return '';
    const m = state.modal;
    if(m.type === 'addJob' || m.type === 'editJob') return renderJobFormModal(m);
    if(m.type === 'newReport') return renderReportFormModal(m);
    if(m.type === 'history') return renderHistoryModal(m);
    if(m.type === 'viewReport') return renderViewReportModal(m);
    return '';
  }

  function renderJobFormModal(m){
    const job = m.type === 'editJob' ? state.jobs.find(j=>j.id===m.jobId) : {name:'',jobNumber:'',foreman:'',foremanPhone:'',address:'',startTime:''};
    return `
      <div class="panel-overlay no-print" onclick="if(event.target===this) App.closeModal()">
        <div class="panel">
          <div class="panel-header"><h2>${m.type==='editJob'?'Edit job':'Add job'}</h2><button class="ghost" onclick="App.closeModal()">Close</button></div>
          <div class="panel-body">
            <div class="field-row">
              <div class="field"><label>Job name</label><input type="text" id="f-name" value="${escapeHtml(job.name)}" placeholder="e.g. Deep Manufacturing"></div>
              <div class="field"><label>Job number</label><input type="text" id="f-jobNumber" value="${escapeHtml(job.jobNumber)}" placeholder="e.g. 21-7037"></div>
            </div>
            <div class="field-row">
              <div class="field"><label>Foreman</label><input type="text" id="f-foreman" value="${escapeHtml(job.foreman)}" placeholder="Foreman name"></div>
              <div class="field"><label>Foreman phone</label><input type="text" id="f-foremanPhone" value="${escapeHtml(job.foremanPhone)}" placeholder="(xxx) xxx-xxxx"></div>
            </div>
            <div class="field"><label>Job address</label><input type="text" id="f-address" value="${escapeHtml(job.address)}" placeholder="Site address"></div>
            <div class="field"><label>Start time</label><input type="text" id="f-startTime" value="${escapeHtml(job.startTime)}" placeholder="e.g. 7:00am"></div>
          </div>
          <div class="panel-footer">
            <button class="ghost" onclick="App.closeModal()">Cancel</button>
            <button class="primary" onclick="App.saveJob('${m.type==='editJob'?m.jobId:''}')">${m.type==='editJob'?'Save changes':'Add job'}</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderReportFormModal(m){
    const job = state.jobs.find(j=>j.id===m.jobId);
    const editing = m.reportId ? state.reports.find(r=>r.id===m.reportId) : null;
    const r = editing || {weekEnding: todayISO(), manpower:'', pctComplete:'', workCompleted:'', delays:'', safetyNotes:'', nextWeekPlan:''};
    return `
      <div class="panel-overlay no-print" onclick="if(event.target===this) App.closeModal()">
        <div class="panel">
          <div class="panel-header"><h2>Weekly report — ${escapeHtml(job.name)}</h2><button class="ghost" onclick="App.closeModal()">Close</button></div>
          <div class="panel-body">
            <div class="field-row">
              <div class="field"><label>Week ending</label><input type="date" id="f-weekEnding" value="${r.weekEnding}"></div>
              <div class="field"><label>Manpower on site</label><input type="number" id="f-manpower" value="${r.manpower}" placeholder="e.g. 6" min="0"></div>
            </div>
            <div class="field">
              <label>% complete</label>
              <input type="number" id="f-pct" value="${r.pctComplete}" placeholder="0-100" min="0" max="100">
            </div>
            <div class="field"><label>Work completed this week</label><textarea id="f-work" placeholder="What got done — rough-in, MCC replacement, panel sets, terminations, etc.">${escapeHtml(r.workCompleted)}</textarea></div>
            <div class="field"><label>Delays / issues</label><textarea id="f-delays" placeholder="Material holds, RFIs, weather, coordination issues — leave blank if none">${escapeHtml(r.delays)}</textarea></div>
            <div class="field"><label>Safety notes</label><textarea id="f-safety" placeholder="JSAs held, incidents, near-misses, toolbox talks — leave blank if none">${escapeHtml(r.safetyNotes)}</textarea></div>
            <div class="field"><label>Next week plan</label><textarea id="f-next" placeholder="What's scheduled for next week">${escapeHtml(r.nextWeekPlan)}</textarea></div>
          </div>
          <div class="panel-footer">
            <button class="ghost" onclick="App.closeModal()">Cancel</button>
            <button class="primary" onclick="App.saveReport('${m.jobId}','${m.reportId||''}')">Save report</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderHistoryModal(m){
    const job = state.jobs.find(j=>j.id===m.jobId);
    const reports = reportsForJob(m.jobId);
    return `
      <div class="panel-overlay no-print" onclick="if(event.target===this) App.closeModal()">
        <div class="panel">
          <div class="panel-header"><h2>Report history — ${escapeHtml(job.name)}</h2><button class="ghost" onclick="App.closeModal()">Close</button></div>
          <div class="panel-body">
            ${reports.length===0 ? '<div class="hint">No reports yet for this job.</div>' : `
            <div class="history-list">
              ${reports.map(r => `
                <div class="history-row">
                  <div class="history-row-left">
                    <span class="history-date">Week ending ${fmtDate(r.weekEnding)}</span>
                    <span class="history-summary">${r.pctComplete?r.pctComplete+'% complete · ':''}${r.manpower?r.manpower+' on site':''}</span>
                  </div>
                  <div style="display:flex;gap:6px;align-items:center;">
                    ${riskBadge(r, true)}
                    <button class="small" onclick="App.viewReport('${r.id}')">View</button>
                    <button class="small ghost" onclick="App.editReport('${m.jobId}','${r.id}')">Edit</button>
                    <button class="small ghost danger-text" onclick="App.deleteReport('${r.id}')">Delete</button>
                  </div>
                </div>
              `).join('')}
            </div>
            `}
          </div>
          <div class="panel-footer">
            <button class="ghost" onclick="App.closeModal()">Close</button>
            <button class="gold" onclick="App.openNewReport('${m.jobId}')">+ New report</button>
          </div>
        </div>
      </div>
    `;
  }

  function renderViewReportModal(m){
    const r = state.reports.find(x=>x.id===m.reportId);
    const job = r ? state.jobs.find(j=>j.id===r.jobId) : null;
    if(!r || !job){
      return `
        <div class="panel-overlay no-print" onclick="if(event.target===this) App.closeModal()">
          <div class="panel">
            <div class="panel-header"><h2>Report not found</h2><button class="ghost" onclick="App.closeModal()">Close</button></div>
            <div class="panel-body"><div class="hint">This report may have been deleted. Close and try again from the job's history.</div></div>
          </div>
        </div>
      `;
    }
    const pct = Math.max(0, Math.min(100, parseInt(r.pctComplete)||0));
    return `
      <div class="panel-overlay no-print" onclick="if(event.target===this) App.closeModal()">
        <div class="panel" style="max-width:760px;">
          <div class="panel-header no-print"><h2>Report preview</h2>
            <div style="display:flex;gap:8px;">
              <button class="gold small" onclick="window.print()">Print / Save PDF</button>
              <button class="ghost small" onclick="App.closeModal()">Close</button>
            </div>
          </div>
          <div style="padding:14px 26px 0;" class="no-print">
            ${r.riskLevel === 'analyzing'
              ? '<div class="hint">Checking this report for risk…</div>'
              : r.riskLevel
                ? `<div style="display:flex;align-items:center;gap:10px;">${riskBadge(r)}<span style="font-size:13px;color:var(--text-sec);">${escapeHtml(r.riskReason||'')}</span><button class="ghost small" onclick="App.reanalyzeRisk('${r.id}')">Re-check</button></div>`
                : `<button class="ghost small" onclick="App.reanalyzeRisk('${r.id}')">Run risk check</button>`
            }
          </div>
          <div class="report-view">
            <div class="report-doc">
              <div class="report-band">
                <div class="rbrand">Hi-Tech Electric, Inc.</div>
                <div class="rtitle">Weekly Job Report</div>
                <div class="rsub">Week ending ${fmtDate(r.weekEnding)}</div>
              </div>
              <div class="report-info">
                <div class="info-item"><div class="il">Job</div><div class="iv">${escapeHtml(job.name)}${job.jobNumber?' ('+escapeHtml(job.jobNumber)+')':''}</div></div>
                <div class="info-item"><div class="il">Foreman</div><div class="iv">${escapeHtml(job.foreman||'—')}${job.foremanPhone?' · '+escapeHtml(job.foremanPhone):''}</div></div>
                <div class="info-item"><div class="il">Job address</div><div class="iv">${escapeHtml(job.address||'—')}</div></div>
                <div class="info-item"><div class="il">Start time</div><div class="iv">${escapeHtml(job.startTime||'—')}</div></div>
                <div class="info-item"><div class="il">Manpower on site</div><div class="iv">${escapeHtml(String(r.manpower||'—'))}</div></div>
                <div class="info-item"><div class="il">% complete</div><div class="iv">${pct}%
                  <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                </div></div>
              </div>
              <div class="report-sections">
                <div class="rsection"><h4>Work completed this week</h4><p>${escapeHtml(r.workCompleted)||'—'}</p></div>
                <div class="rsection"><h4>Delays / issues</h4><p>${escapeHtml(r.delays)||'None reported'}</p></div>
                <div class="rsection"><h4>Safety notes</h4><p>${escapeHtml(r.safetyNotes)||'No incidents or concerns'}</p></div>
                <div class="rsection"><h4>Next week plan</h4><p>${escapeHtml(r.nextWeekPlan)||'—'}</p></div>
                ${r.riskLevel && r.riskLevel !== 'analyzing' ? `<div class="rsection"><h4>Risk assessment</h4><p>${escapeHtml((r.riskLevel==='high'?'High risk':r.riskLevel==='medium'?'Watch':'Low risk'))} — ${escapeHtml(r.riskReason||'')}</p></div>` : ''}
              </div>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  // ---------- Actions ----------
  const App = {
    openAddJob(){ state.modal = {type:'addJob'}; render(); },
    openEditJob(jobId){ state.modal = {type:'editJob', jobId}; render(); },
    async deleteJob(jobId){
      if(!confirm('Delete this job and all its report history? This cannot be undone.')) return;
      state.jobs = state.jobs.filter(j=>j.id!==jobId);
      state.reports = state.reports.filter(r=>r.jobId!==jobId);
      await saveJobs(); await saveReports();
      render();
    },
    async saveJob(existingId){
      const name = document.getElementById('f-name').value.trim();
      if(!name){ alert('Job name is required.'); return; }
      const jobNumber = document.getElementById('f-jobNumber').value.trim();
      const foreman = document.getElementById('f-foreman').value.trim();
      const foremanPhone = document.getElementById('f-foremanPhone').value.trim();
      const address = document.getElementById('f-address').value.trim();
      const startTime = document.getElementById('f-startTime').value.trim();
      if(existingId){
        const job = state.jobs.find(j=>j.id===existingId);
        Object.assign(job, {name, jobNumber, foreman, foremanPhone, address, startTime});
      } else {
        state.jobs.push({id: uid(), name, jobNumber, foreman, foremanPhone, address, startTime, createdAt: todayISO()});
      }
      await saveJobs();
      state.modal = null;
      render();
    },
    openNewReport(jobId){ state.modal = {type:'newReport', jobId}; render(); },
    editReport(jobId, reportId){ state.modal = {type:'newReport', jobId, reportId}; render(); },
    async saveReport(jobId, existingId){
      const weekEnding = document.getElementById('f-weekEnding').value;
      if(!weekEnding){ alert('Week ending date is required.'); return; }
      const data = {
        weekEnding,
        manpower: document.getElementById('f-manpower').value.trim(),
        pctComplete: document.getElementById('f-pct').value.trim(),
        workCompleted: document.getElementById('f-work').value.trim(),
        delays: document.getElementById('f-delays').value.trim(),
        safetyNotes: document.getElementById('f-safety').value.trim(),
        nextWeekPlan: document.getElementById('f-next').value.trim(),
      };
      let savedId;
      if(existingId){
        const r = state.reports.find(x=>x.id===existingId);
        Object.assign(r, data);
        r.riskLevel = 'analyzing'; r.riskReason = null;
        savedId = existingId;
      } else {
        savedId = uid();
        state.reports.push({id: savedId, jobId, ...data, riskLevel:'analyzing', riskReason:null, createdAt: new Date().toISOString()});
      }
      await saveReports();
      state.modal = {type:'viewReport', reportId: savedId};
      render();
      runRiskAnalysis(savedId);
    },
    openHistory(jobId){ state.modal = {type:'history', jobId}; render(); },
    viewReport(reportId){ state.modal = {type:'viewReport', reportId}; render(); },
    reanalyzeRisk(reportId){
      const r = state.reports.find(x=>x.id===reportId);
      if(r){ r.riskLevel = 'analyzing'; r.riskReason = null; render(); runRiskAnalysis(reportId); }
    },
    async deleteReport(reportId){
      if(!confirm('Delete this report?')) return;
      const r = state.reports.find(x=>x.id===reportId);
      state.reports = state.reports.filter(x=>x.id!==reportId);
      await saveReports();
      state.modal = {type:'history', jobId: r.jobId};
      render();
    },
    closeModal(){ state.modal = null; render(); }
  };
  window.App = App;

  loadAll();
})();
</script>
</body>
</html>
